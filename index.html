<script>
(function(){

 en:{route:"Route",m:"m",away:"away",nearest:"Nearest",noGeo:"Location unavailable. Allow access or zoom yourself.",locating:"Locating …",none:"No point in this selection. Switch a filter on.",n:"points",stand:"OSM as of",src:"Data:",foot:"No tracking, your location stays on the device. Wrong? Fix it in OpenStreetMap.",wheel:"wheelchair accessible",bottle:"bottle refill",noleaf:"The map could not be loaded.",info:"Data and notes",air:"straight line",walk:"on foot",min:"min",calc:"Calculating walking route …",hide:"Hide route",osmroute:"Route in OSM",load:"Loading places from OpenStreetMap …",loadfail:"OpenStreetMap (Overpass) is not answering right now. Try again later.",here:"Load this area",live:"live via Overpass",osmnote:"Places come live from OpenStreetMap (Overpass API, overpass-api.de); only the map area is sent, never your location. The result is cached in your browser for 24 h.",routenote:"The walking route is computed by routing.openstreetmap.de (FOSSGIS, OSRM); only start and destination are sent."},};
let lang=(navigator.language||"de").slice(0,2); if(!I[lang]) lang="de";
const KEY="map-lang-goodplacetogo"; try{const s=localStorage.getItem(KEY); if(s&&I[s]) lang=s;}catch(e){}
const t=k=>(I[lang][k]!==undefined?I[lang][k]:COMMON[lang][k]);
const DESC=document.querySelector('meta[name=description]').content;

const $=id=>document.getElementById(id);
const hidden=new Set(DEFAULT_OFF); let me=null, meMarker=null, line=null;
const data=(window.POINTS||[]);
if(!window.L){ $("map").innerHTML='<p style="padding:16px;color:var(--muted)">'+esc(COMMON[lang].noleaf)+'</p>'; }
const map=window.L?L.map("map",{zoomControl:true}).setView([46.948,7.447],14):null;
if(map){ L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map); }
const layer=map?L.layerGroup().addTo(map):null;
const icon=c=>L.divIcon({className:"",html:`<div class="dot" style="background:${CLASSES[c].color}"></div>`,iconSize:[16,16],iconAnchor:[8,8]});
function label(p){ const lines=[`<b>${esc(CLASSES[p.c][lang])}</b>`].concat(p.f.map(x=>esc(tx(x)))); if(p.w==="yes") lines.push(t("wheel")); if(p.b==="yes") lines.push(t("bottle"));
  lines.push(`<a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=walking" rel="noopener">${t("route")}</a> · <a href="https://www.openstreetmap.org/${p.ty}/${p.id}" rel="noopener">OSM</a>`); return lines.join("<br>"); }
const TX={"de": {"italian": "Italienisch", "pizza": "Pizza", "swiss": "Schweizer Küche", "regional": "Regional", "asian": "Asiatisch", "chinese": "Chinesisch", "thai": "Thailändisch", "indian": "Indisch", "japanese": "Japanisch", "sushi": "Sushi", "kebab": "Kebab", "turkish": "Türkisch", "burger": "Burger", "vietnamese": "Vietnamesisch", "mexican": "Mexikanisch", "french": "Französisch", "greek": "Griechisch", "coffee shop": "Kaffee", "international": "International", "vegetarian": "Vegetarisch", "vegan": "Vegan", "spanish": "Spanisch", "tapas": "Tapas", "lebanese": "Libanesisch", "american": "Amerikanisch", "steak house": "Steakhaus", "fish": "Fisch", "seafood": "Meeresfrüchte", "nepalese": "Nepalesisch", "korean": "Koreanisch", "ethiopian": "Äthiopisch", "eritrean": "Eritreisch", "portuguese": "Portugiesisch", "german": "Deutsch", "tibetan": "Tibetisch", "sri lankan": "Sri-lankisch", "pasta": "Pasta", "ice cream": "Glacé", "bakery": "Bäckerei", "sandwich": "Sandwich", "breakfast": "Frühstück", "brunch": "Brunch", "cake": "Kuchen", "chicken": "Poulet", "noodle": "Nudeln", "ramen": "Ramen", "tea": "Tee", "wine bar": "Weinbar", "bio": "Bio", "persian": "Persisch", "afghan": "Afghanisch", "syrian": "Syrisch", "peruvian": "Peruanisch", "brazilian": "Brasilianisch", "african": "Afrikanisch", "mediterranean": "Mediterran", "austrian": "Österreichisch", "fondue": "Fondue", "raclette": "Raclette", "grill": "Grill", "bbq": "Barbecue", "self service": "Selbstbedienung", "cafeteria": "Cafeteria", "bistro": "Bistro", "bar": "Bar", "pub": "Pub", "chinese;asian": "Chinesisch", "hofladen": "Hofladen", "self service 24h": "Selbstbedienung, 24 h"}, "en": {"italian": "Italian", "pizza": "Pizza", "swiss": "Swiss", "regional": "Regional", "asian": "Asian", "chinese": "Chinese", "thai": "Thai", "indian": "Indian", "japanese": "Japanese", "sushi": "Sushi", "kebab": "Kebab", "turkish": "Turkish", "burger": "Burger", "vietnamese": "Vietnamese", "mexican": "Mexican", "french": "French", "greek": "Greek", "coffee shop": "Coffee", "international": "International", "vegetarian": "Vegetarian", "vegan": "Vegan", "spanish": "Spanish", "tapas": "Tapas", "lebanese": "Lebanese", "american": "American", "steak house": "Steak house", "fish": "Fish", "seafood": "Seafood", "nepalese": "Nepalese", "korean": "Korean", "ethiopian": "Ethiopian", "eritrean": "Eritrean", "portuguese": "Portuguese", "german": "German", "tibetan": "Tibetan", "sri lankan": "Sri Lankan", "pasta": "Pasta", "ice cream": "Ice cream", "bakery": "Bakery", "sandwich": "Sandwich", "breakfast": "Breakfast", "brunch": "Brunch", "cake": "Cake", "chicken": "Chicken", "noodle": "Noodles", "ramen": "Ramen", "tea": "Tea", "wine bar": "Wine bar", "bio": "Organic", "persian": "Persian", "afghan": "Afghan", "syrian": "Syrian", "peruvian": "Peruvian", "brazilian": "Brazilian", "african": "African", "mediterranean": "Mediterranean", "austrian": "Austrian", "fondue": "Fondue", "raclette": "Raclette", "grill": "Grill", "bbq": "Barbecue", "self service": "Self service", "cafeteria": "Cafeteria", "bistro": "Bistro", "bar": "Bar", "pub": "Pub", "chinese;asian": "Chinese", "hofladen": "Farm shop", "self service 24h": "Self service, 24 h"}};
const DAYS_DE={Mo:"Mo",Tu:"Di",We:"Mi",Th:"Do",Fr:"Fr",Sa:"Sa",Su:"So",PH:"Feiertag"}, MON_DE={Jan:"Jan",Feb:"Feb",Mar:"Mär",Apr:"Apr",May:"Mai",Jun:"Jun",Jul:"Jul",Aug:"Aug",Sep:"Sep",Oct:"Okt",Nov:"Nov",Dec:"Dez"};
function tx(s){ s=String(s); const m=TX[lang]; if(m&&m[s]!==undefined) return m[s]; let r=s;
  if(lang==="en"){ r=r.replace(/^Trinkwasser (\d+ m)$/,"Drinking water $1").replace(/^winter off$/,"closed in winter"); }
  else { const hours=/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH)\b/.test(r)&&/\d|off|closed/.test(r);
    if(hours){ r=r.replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH)\b/g,d=>DAYS_DE[d]).replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g,d=>MON_DE[d]).replace(/\b(closed|off)\b/g,"geschlossen"); }
    r=r.replace(/^winter off$/,"im Winter geschlossen").replace(/^Mar-Nov$/,"Mär–Nov"); }
  return r; }
const visible=p=>!hidden.has(p.c);
function draw(){ if(!layer) return; layer.clearLayers(); let n=0; data.forEach(p=>{ if(!visible(p)) return; n++; L.marker([p.lat,p.lon],{icon:icon(p.c)}).bindPopup(label(p)).addTo(layer); });
  $("meta").textContent=`${n} ${t("n")}, ${t("live")}${META.stamp?", "+t("stand")+" "+META.stamp:""}`; }
function dist(a,b,c,d){const R=6371000,q=Math.PI/180,x=(c-a)*q,y=(d-b)*q,h=Math.sin(x/2)**2+Math.cos(a*q)*Math.cos(c*q)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
let routeSeq=0, routeCtl=null;
function fmtDist(m){ return m>=1000?(m/1000).toFixed(1).replace(".",lang==="de"?",":".")+" km":Math.round(m)+" "+t("m"); }
function nearest(){ if(!me||!map) return; let best=null,bd=1e12; data.forEach(p=>{ if(!visible(p)) return; const d=dist(me[0],me[1],p.lat,p.lon); if(d<bd){bd=d;best=p;} });
  const pan=$("panel"); if(!best){ pan.innerHTML=`<span>${esc(t("none"))}</span>`; K.shake(pan); return; }
  if(line) map.removeLayer(line); line=L.polyline([me,[best.lat,best.lon]],{color:"#2f7bff",dashArray:"6 6",weight:3}).addTo(map); map.fitBounds(line.getBounds(),{padding:[40,40],maxZoom:17});
  const osm=`https://www.openstreetmap.org/directions?engine=fossgis_osrm_foot&route=${me[0]}%2C${me[1]}%3B${best.lat}%2C${best.lon}`;
  pan.innerHTML=`<div class="res"><div class="dist calc" id="dist">${fmtDist(bd)}<small>${t("calc")}</small></div><div class="what"><b>${esc(CLASSES[best.c][lang])}</b><span>${best.f[0]?esc(best.f[0]):""}</span></div><div class="acts"><a class="k-btn primary" href="https://www.google.com/maps/dir/?api=1&destination=${best.lat},${best.lon}&travelmode=walking" rel="noopener">${t("route")}</a><a class="k-btn" href="${osm}" rel="noopener">${t("osmroute")}</a><button type="button" class="k-btn quiet" data-act="hide">${t("hide")}</button></div></div>`;
  K.pop(pan); L.popup().setLatLng([best.lat,best.lon]).setContent(label(best)).openOn(map);
  walkRoute(best,bd); }
function walkRoute(best,bd){ const seq=++routeSeq; if(routeCtl) routeCtl.abort(); routeCtl=new AbortController(); const ctl=routeCtl; const tm=setTimeout(()=>ctl.abort(),9000);
  const url=`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${me[1]},${me[0]};${best.lon},${best.lat}?overview=full&geometries=geojson&steps=false`;
  const done=(m,label,km)=>{ clearTimeout(tm); if(seq!==routeSeq) return; const d=$("dist"); if(!d) return; d.classList.remove("calc"); d.innerHTML=`${fmtDist(m)}<small>${label}</small>`; };
  fetch(url,{signal:ctl.signal,referrerPolicy:"no-referrer"}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{ const rt=j&&j.routes&&j.routes[0]; if(!rt||!rt.geometry||!rt.geometry.coordinates) throw 0; if(seq!==routeSeq) return;
    const pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]); if(line) map.removeLayer(line); line=L.polyline(pts,{color:"#2f7bff",weight:5,opacity:.9,lineCap:"round",lineJoin:"round"}).addTo(map); map.fitBounds(line.getBounds(),{padding:[40,40],maxZoom:17});
    done(rt.distance,`${t("walk")} · ${Math.max(1,Math.round(rt.duration/60))} ${t("min")}`); }).catch(()=>done(bd,t("air"))); }
function clearLine(){ routeSeq++; if(routeCtl) routeCtl.abort(); if(line&&map){ map.removeLayer(line); line=null; } if(map) map.closePopup(); $("panel").innerHTML=`<span id="hint">${esc(t("hint"))}</span>`; }
$("panel").addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("[data-act=hide]"); if(b){ clearLine(); K.tick(6); } });
function locate(){ const b=$("near"); if(!navigator.geolocation||!map){ K.shake(b); K.toast(t("noGeo")); return; }
  b.disabled=true; const old=b.textContent; b.textContent=t("locating");
  navigator.geolocation.getCurrentPosition(p=>{ b.disabled=false; b.textContent=old; me=[p.coords.latitude,p.coords.longitude]; if(meMarker) map.removeLayer(meMarker);
    meMarker=L.marker(me,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map); nearest(); },
    ()=>{ b.disabled=false; b.textContent=old; K.shake(b); K.toast(t("noGeo")); },{enableHighAccuracy:true,timeout:10000}); }
function tools(){ const el=$("tools"); el.innerHTML=""; const counts={}; data.forEach(p=>{counts[p.c]=(counts[p.c]||0)+1;});
  Object.keys(CLASSES).forEach(k=>{ const b=document.createElement("button"); b.type="button"; b.className="k-chip"; b.setAttribute("aria-pressed",hidden.has(k)?"false":"true");
    b.innerHTML=`<i style="background:${CLASSES[k].color}"></i>${esc(CLASSES[k][lang])} <b>${counts[k]||0}</b>`; b.onclick=()=>{ hidden.has(k)?hidden.delete(k):hidden.add(k); b.setAttribute("aria-pressed",hidden.has(k)?"false":"true"); draw(); }; el.appendChild(b); });
  const hb=document.createElement("button"); hb.type="button"; hb.className="k-btn"; hb.textContent=t("here"); hb.onclick=()=>{ if(!map) return; const bb=map.getBounds(); let S=bb.getSouth(),W=bb.getWest(),N=bb.getNorth(),E=bb.getEast(); const cy=(S+N)/2,cx=(W+E)/2; const h=Math.min(N-S,0.36)/2, w=Math.min(E-W,0.5)/2; load([cy-h,cx-w,cy+h,cx+w],true); K.tick(6); }; el.appendChild(hb);
  $("near").textContent=t("near"); }
$("near").addEventListener("click",locate);
function applyLang(){ document.documentElement.lang=lang; document.title=t("title");
  $("h").textContent=t("title"); $("s").textContent=t("sub")||""; if($("hint")) $("hint").textContent=t("hint"); $("src").textContent=t("src"); $("foot").textContent=t("foot"); $("routenote").textContent=t("routenote"); $("osmnote").textContent=t("osmnote"); $("infoSum").textContent=t("info"); $("map").setAttribute("aria-label",lang==="de"?"Karte":"Map"); document.querySelector('meta[name=description]').content=(lang==="de"?DESC:(t("sub")||DESC));
  const b=$("banner"); if(BANNER&&t("banner")){ b.hidden=false; b.innerHTML=esc(t("banner").replace("{d}",BANNER.date).replace("{s}",BANNER.status))+` <a href="${BANNER.url}" rel="noopener">naturgefahren.be.ch</a>`; } else b.hidden=true;
  document.querySelectorAll(".lang button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.l===lang?"true":"false")); tools(); draw(); if(map) setTimeout(()=>map.invalidateSize(),50); }
document.querySelectorAll(".lang button").forEach(x=>x.addEventListener("click",()=>{lang=x.dataset.l; try{localStorage.setItem(KEY,lang);}catch(e){} applyLang();}));

/* live places from OpenStreetMap (Overpass) */
const META={stamp:""}; const OVP="https://overpass-api.de/api/interpreter"; const CK="gptg-v1"; const BERN=[46.86,7.30,47.04,7.60];
function toP(e){ const g=e.tags||{}; const c=g.shop==="farm"?"farm":(g.amenity==="cafe"?"cafe":(g.amenity==="restaurant"?"rest":null)); if(!c) return null;
  const lat=e.lat!=null?e.lat:(e.center&&e.center.lat), lon=e.lon!=null?e.lon:(e.center&&e.center.lon); if(lat==null||lon==null) return null;
  const f=[]; if(g.name) f.push(g.name); if(g.cuisine) f.push(g.cuisine.split(";")[0].replace(/_/g," ")); if(g.organic==="yes"||g.organic==="only") f.push("bio"); if(g.opening_hours) f.push(g.opening_hours);
  const ad=[g["addr:street"],g["addr:housenumber"]].filter(Boolean).join(" "), city=[g["addr:postcode"],g["addr:city"]].filter(Boolean).join(" "); if(ad||city) f.push([ad,city].filter(Boolean).join(", "));
  const ph=g.phone||g["contact:phone"]; if(ph) f.push(ph); const ws=g.website||g["contact:website"]; if(ws) f.push(ws.replace(/^https?:\/\//,"").replace(/\/$/,""));
  return {id:e.id,ty:e.type,lat:+lat,lon:+lon,c,f,w:g.wheelchair||""}; }
function setData(list,stamp){ data.length=0; list.forEach(p=>data.push(p)); META.stamp=stamp||""; tools(); draw(); }
function load(bbox,force){ const key=CK+":"+bbox.map(x=>(+x).toFixed(2)).join(",");
  if(!force){ try{ const c=JSON.parse(localStorage.getItem(key)||"null"); if(c&&Date.now()-c.t<864e5&&Array.isArray(c.p)){ setData(c.p,c.s); return; } }catch(e){} }
  $("meta").textContent=t("load"); const bb=bbox.map(x=>(+x).toFixed(4)).join(",");
  const q=`[out:json][timeout:25];(nwr["shop"="farm"](${bb});nwr["amenity"="cafe"](${bb});nwr["amenity"="restaurant"](${bb}););out center tags;`;
  fetch(OVP,{method:"POST",body:"data="+encodeURIComponent(q),referrerPolicy:"no-referrer"}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{ const p=(j.elements||[]).map(toP).filter(Boolean); const st=((j.osm3s&&j.osm3s.timestamp_osm_base)||"").slice(0,10); setData(p,st); try{ localStorage.setItem(key,JSON.stringify({t:Date.now(),p,s:st})); }catch(e){} })
    .catch(()=>{ $("meta").textContent=t("loadfail"); K.toast(t("loadfail")); }); }
applyLang();
load(BERN,false);
})();
