name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sanity check
        run: |
          grep -q 'name="viewport"' index.html
          grep -q 'window.POINTS=' data.js
          ! grep -qiE 'XMLHttpRequest|sendBeacon|gtag|analytics' index.html
          # exactly two network calls: Overpass (places) and FOSSGIS OSRM (walking route)
          test "$(grep -o 'fetch([^,)]*' index.html | sort -u | wc -l)" -eq 2
          grep -q 'https://overpass-api.de/api/interpreter' index.html
          grep -q 'https://routing.openstreetmap.de/routed-foot/' index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html data.js _site/
          cp -r assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
